# Environment for the optional independent leakage control (analysis/leakage_control.py):
# global alignments with EMBOSS needleall (as GraphPart), a parasail prefilter and
# MMseqs2 for the significance of the AF3-style identity.
#   conda env create -f envs/leakage_control.yml
#   snakemake --cores 20 leakage_control
name: leakage_control
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - parasail-python=1.3.4
  - emboss=6.6.0
  - mmseqs2=18.8cc5c
  - pandas
  - numpy
  - pyyaml
  - requests
  - tqdm
